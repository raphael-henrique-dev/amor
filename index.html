<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer namorar comigo?</title>
    <!-- Google Fonts para tipografia moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #ffe6eb;
            --pink-vivid: #ff6699;
            --red-vivid: #ff4d4d;
            --yellow-pastel: #fdfd96;
            --yellow-vivid: #ffeb3b;
            --text-color: #5a2e3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--pink-light);
            /* Padrão de fundo fofo (bolinhas) */
            background-image: radial-gradient(#ffc2d1 20%, transparent 20%), radial-gradient(#ffc2d1 20%, transparent 20%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden; /* Para não criar scroll quando o botão fugir */
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem 2rem;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(255, 102, 153, 0.2),
                        0 2px 10px rgba(255, 102, 153, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
            /* Animação suave flutuante */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .heart {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--red-vivid);
            display: inline-block;
            animation: pulse 1.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            filter: drop-shadow(0 4px 8px rgba(255, 77, 77, 0.3));
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            color: var(--pink-vivid);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            min-height: 55px; /* Para manter o espaço quando o botão sair */
            position: relative;
        }

        button {
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 0.75rem 2.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.2s;
            z-index: 100;
        }

        button:active {
            transform: scale(0.95) !important;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--pink-vivid), var(--red-vivid));
            color: white;
            box-shadow: 0 6px 20px rgba(255, 102, 153, 0.4);
            position: relative;
            z-index: 2;
        }

        .btn-yes:hover {
            box-shadow: 0 8px 25px rgba(255, 102, 153, 0.6);
            transform: translateY(-2px);
        }

        .btn-no {
            background: var(--yellow-pastel);
            color: var(--text-color);
            box-shadow: 0 6px 20px rgba(253, 253, 150, 0.6);
            /* Transição para o movimento ser mais suave */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-no:hover {
            background: var(--yellow-vivid);
        }
        
        .success-message {
            display: none;
            font-size: 1.5rem;
            color: var(--red-vivid);
            font-weight: 800;
            margin-top: 1rem;
            animation: fadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Estilos dos Confetes */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: none;
            animation: fall linear forwards;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div class="heart" id="heart"**/>❤️</div>
        <h1 id="title">quer namorar comigo?</h1>
        <div class="buttons-container" id="buttons-container">
            <button class="btn-yes" id="btn-yes">simm</button>
            <button class="btn-no" id="btn-no">nao eu te odeio</button>
        </div>
        <div class="success-message" id="success-message">
            eu te amo 💖
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const buttonsContainer = document.getElementById('buttons-container');
        const successMessage = document.getElementById('success-message');
        const title = document.getElementById('title');
        const heart = document.getElementById('heart');

        let isRunningAway = false;

        function moveButton(e) {
            // Se for touch, previne o comportamento padrão para não clicar por acidente
            if (e.type === 'touchstart') {
                e.preventDefault();
            }
            
            if (!isRunningAway) {
                // Na primeira vez que foge, tira o botão do fluxo flexbox e coloca fixo no body
                const rect = btnNo.getBoundingClientRect();
                
                // Definir largura fixa para evitar redimensionamento estranho
                btnNo.style.width = rect.width + 'px';
                btnNo.style.height = rect.height + 'px';
                
                document.body.appendChild(btnNo);
                btnNo.style.position = 'fixed';
                btnNo.style.left = rect.left + 'px';
                btnNo.style.top = rect.top + 'px';
                
                // Força um pequeno delay antes do primeiro pulo
                setTimeout(jump, 50);
                isRunningAway = true;
                return;
            }

            jump();
        }

        function jump() {
            const btnRect = btnNo.getBoundingClientRect();
            const padding = 20; // Manter distância das bordas
            
            // Calcula o espaço disponível na tela
            const maxX = window.innerWidth - btnRect.width - padding;
            const maxY = window.innerHeight - btnRect.height - padding;
            
            // Gera nova posição aleatória
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Eventos para mouse (desktop) e toque (mobile)
        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', moveButton, { passive: false });

        // Animação de sucesso quando clica em "Sim"
        btnYes.addEventListener('click', () => {
            // Esconde os botões e altera o texto
            buttonsContainer.style.display = 'none';
            if (isRunningAway) {
                btnNo.style.display = 'none';
            } else {
                btnNo.style.display = 'none'; // Caso a pessoa seja muito rápida
            }
            
            title.style.display = 'none';
            heart.textContent = '💖';
            successMessage.style.display = 'block';
            
            // Dispara a festa!
            createConfetti();
        });

        function createConfetti() {
            const colors = ['#ff6699', '#ff4d4d', '#fdfd96', '#ffd1dc', '#ffeb3b', '#e1bee7'];
            
            // Gera 120 confetes em momentos diferentes
            for (let i = 0; i < 1200; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    
                    // Posição inicial (aleatória no topo da tela)
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-20px';
                    
                    // Cor aleatória
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Formato aleatório (bolinhas e quadradinhos)
                    if (Math.random() > 0.5) {
                        confetti.style.borderRadius = '50%';
                    }
                    
                    // Tamanho aleatório
                    const size = Math.random() * 8 + 6;
                    confetti.style.width = size + 'px';
                    confetti.style.height = size + 'px';
                    
                    // Duração da queda aleatória
                    const duration = Math.random() * 2 + 1.5;
                    confetti.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(confetti);
                    
                    // Limpa do DOM depois que a animação acaba
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000);
                }, i * 20); // Cria um confete a cada 20ms para fazer o efeito de chuva
            }
        }
    </script>
</body>
</html>
